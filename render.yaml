services:
  - type: web
    name: clipforge-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE
        value: int8
      - key: API_URL
        value: http://127.0.0.1:9000/
      - key: API_PORT
        value: "9000"
      - key: FORCE_LOCAL_PROCESSING
        value: "always"