<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aim Trainer</title><style>body{background:#090909;color:white;font-family:Arial;text-align:center;padding:18px}button{background:#e32636;color:white;border:0;padding:14px;border-radius:9px}#target{width:58px;height:58px;border-radius:50%;background:#ff3030;position:absolute;left:40%;top:45%;border:5px solid #ffaaaa}</style></head><body><h2>MIM FX AIM TRAINER</h2><p>Tap the moving target as quickly as you can.</p><p id="score">Score: 0</p><button onclick="start()">START 20-SECOND SESSION</button><div id="target" onclick="hit()"></div><script>let score=0,end=0,timer;function start(){score=0;end=Date.now()+20000;document.getElementById('score').textContent='Score: 0';clearInterval(timer);timer=setInterval(()=>{if(Date.now()>=end){clearInterval(timer);alert('Session complete. Score: '+score);return}let t=document.getElementById('target');t.style.left=Math.random()*75+'%';t.style.top=(20+Math.random()*65)+'%';},650)}function hit(){if(Date.now()<end){score++;document.getElementById('score').textContent='Score: '+score;let t=document.getElementById('target');t.style.left=Math.random()*75+'%';t.style.top=(20+Math.random()*65)+'%';}}</script></body></html>
